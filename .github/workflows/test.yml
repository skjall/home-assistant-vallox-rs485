name: Tests

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run tests with coverage
        run: |
          pytest --cov=custom_components/vallox_rs485 --cov-report=xml --cov-fail-under=95

      - name: Run mypy strict
        run: |
          mypy --strict --ignore-missing-imports custom_components/vallox_rs485/

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          python -c "import json; [json.load(open(f)) for f in __import__('glob').glob('custom_components/**/*.json', recursive=True)]"

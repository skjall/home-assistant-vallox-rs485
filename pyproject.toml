[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # import order
  "UP",        # pyupgrade
  "B",         # bugbear
  "SIM",       # simplify
  "RUF",       # ruff
  "D",         # docstrings
  "ASYNC",     # async pitfalls
  "TRY",       # exception handling
]
ignore = [
  "D203",      # conflicts with D211
  "D213",      # conflicts with D212
  "TRY003",    # messages live in strings.json, not in the raise
]

[tool.ruff.lint.per-file-ignores]
# Tests say what they check in their name; the package has its own tests too.
"**/tests/*" = ["D", "SLF001"]
"scripts/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]

[tool.ha_standards]
# Defaults apply when a key is absent; write one down only when this
# project genuinely differs. See the standards document for what each
# key means.

# The fan is a single entity with a fixed translation key rather than one
# built from a description table, so the icon check cannot find it by
# reading the descriptions.
derived_translation_keys = ["fan:ventilation"]

[tool.ha_standards.readme]
# The README says all of this already, under headings of its own. The
# standards care that a section exists, not what it is called.
docs-supported-devices = "Supported Models"
docs-supported-functions = "Features"
docs-data-update = "Active Polling"
docs-known-limitations = "Important Warnings"
docs-examples = "Automation Examples"
docs-installation-parameters = "Manual Configuration"
docs-configuration-parameters = "Configuration Parameters"
docs-troubleshooting = "Troubleshooting"
docs-use-cases = "Use Cases"

[tool.ha_standards.coverage]
# "config_flow.py" = 100

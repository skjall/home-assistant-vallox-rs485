; Managed by ha-integration-standards. Do not edit: `ha-standards sync`
; rewrites this file.
;
; strict is the claim the quality scale makes, so it stays on for the
; integration's own code.

[mypy]
strict = True
ignore_missing_imports = True

; Home Assistant re-exports a great many names implicitly: 2026.10 moved
; BinarySensorDeviceClass into binary_sensor/const.py and kept it reachable
; from the package with a bare `from .const import ...  # noqa: F401`. Core
; itself imports it from the package in dozens of places, so that is the
; intended path, and --no-implicit-reexport (which strict turns on) is simply
; the wrong setting to point at somebody else's package. It is relaxed for
; homeassistant only; the integration's own modules stay strict.
[mypy-homeassistant.*]
implicit_reexport = True
